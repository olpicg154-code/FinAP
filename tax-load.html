<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Податкове навантаження</title>

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/tools.css">
</head>

<body>

<main class="tools-page">

    <div class="tools-top">
        <div>
            <div class="currency-label">FINAP TOOL</div>
            <h1>Податкове навантаження</h1>
            <p>Оцінка ефективної ставки</p>
        </div>

        <a href="tools.html" class="back-button">
            ← ДО ІНСТРУМЕНТІВ
        </a>
    </div>

    <section class="converter-card">

        <div class="converter-title">
            <span>РОЗРАХУНОК</span>
            <span>● TAX</span>
        </div>

        <div class="currency-row">
            <div class="currency-select">
                <label>Дохід ($)</label>
                <input id="income" type="number" placeholder="100000">
            </div>

            <div class="currency-select">
                <label>Тип</label>
                <select id="type">
                    <option value="fop5">ФОП 5%</option>
                    <option value="fop3">ФОП 3% + ПДВ</option>
                    <option value="company">Компанія (18%)</option>
                </select>
            </div>
        </div>

        <div class="result-box">
            <div class="result-label">РЕЗУЛЬТАТ</div>
            <div id="taxResult" class="result-value">--</div>
            <div id="taxDetails" class="rate-info">Введіть дані</div>
        </div>

    </section>

</main>

<script src="js/tax-load.js"></script>

</body>
</html>
