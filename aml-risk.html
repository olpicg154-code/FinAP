<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinAP — AML Risk Check</title>

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/currency-converter.css">
</head>

<body>

<main class="currency-page">

    <div class="currency-top">

        <div>
            <div class="currency-label">FINAP TOOLS</div>
            <h1>AML Risk Check</h1>
            <p>Оцінка ризику клієнта та фінансової операції</p>
        </div>

        <a href="tools.html" class="currency-back">
            ← ДО ІНСТРУМЕНТІВ
        </a>

    </div>


    <section class="converter-card">

        <div class="converter-title">
            <span>АНАЛІЗ РИЗИКУ</span>
            <span class="nbu-status">● AML / FATF</span>
        </div>


        <div class="currency-row">

            <div class="currency-select">
                <label>Країна</label>
                <select id="country">
    <option value="UA">Україна</option>
    <option value="PL">Польща</option>
    <option value="DE">Німеччина</option>
    <option value="US">США</option>
    <option value="GB">Велика Британія</option>
    <option value="TR">Туреччина</option>
    <option value="AE">ОАЕ</option>
    <option value="CY">Кіпр</option>
    <option value="VG">BVI (офшор)</option>
    <option value="PA">Панама</option>
</select>
            </div>

            <div></div>

            <div class="currency-select">
                <label>Тип клієнта</label>
                <select id="clientType">
                    <option value="low">Фізична особа</option>
                    <option value="medium">ФОП</option>
                    <option value="high">Юридична особа</option>
                </select>
            </div>

        </div>


        <div class="currency-row">

            <div class="currency-select">
                <label>PEP</label>
                <select id="pep">
                    <option value="0">Ні</option>
                    <option value="50">Так</option>
                </select>
            </div>

            <div></div>

            <div class="currency-select">
                <label>Сума ($)</label>
                <input id="amount" type="number" placeholder="10000">
            </div>

        </div>


        <div class="currency-row">

            <div class="currency-select">
                <label>Тип операції</label>
                <select id="operation">
                    <option value="low">Звичайний платіж</option>
                    <option value="medium">Міжнародний переказ</option>
                    <option value="high">Готівка / крипто</option>
                </select>
            </div>

        </div>


        <div class="result-box">

            <div class="result-label">РИЗИК</div>

            <div id="riskResult" class="result-value">
                --
            </div>
<div id="riskScore" style="font-size:14px; opacity:0.7; margin-top:5px;">--</div>
<div id="riskAdvice" style="margin-top:10px; font-size:14px;"></div>


            <div id="riskText" class="rate-info">
                Введіть параметри
            </div>

        </div>

<div id="riskBreakdown" style="margin-top:20px; font-size:14px; opacity:0.85;">
    Деталі ризику зʼявляться тут
</div>

</section>

</main>

<script src="js/aml-risk.js"></script>

</body>
</html>
