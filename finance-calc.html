<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фінансовий калькулятор</title>

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/tools.css">
</head>

<body>

<main class="tools-page">

    <div class="tools-top">
        <div>
            <div class="currency-label">FINAP TOOL</div>
            <h1>Фінансовий калькулятор</h1>
            <p>Кредити та депозити</p>
        </div>

        <a href="tools.html" class="back-button">
            ← ДО ІНСТРУМЕНТІВ
        </a>
    </div>

    <section class="converter-card">

        <div class="converter-title">
            <span>РОЗРАХУНОК</span>
            <span>● FIN</span>
        </div>

        <div class="currency-row">
            <div class="currency-select">
                <label>Сума ($)</label>
                <input id="amount" type="number" placeholder="10000">
            </div>

            <div class="currency-select">
                <label>Ставка (%)</label>
                <input id="rate" type="number" placeholder="10">
            </div>
        </div>

        <div class="currency-row">
            <div class="currency-select">
                <label>Термін (місяців)</label>
                <input id="months" type="number" placeholder="12">
            </div>

            <div class="currency-select">
                <label>Тип</label>
                <select id="type">
                    <option value="loan">Кредит</option>
                    <option value="deposit">Депозит</option>
                </select>
            </div>
        </div>

        <div class="result-box">
            <div class="result-label">РЕЗУЛЬТАТ</div>
            <div id="resultValue" class="result-value">--</div>
            <div id="resultDetails" class="rate-info">Введіть дані</div>
        </div>

    </section>

</main>

<script src="js/finance-calc.js"></script>

</body>
</html>
