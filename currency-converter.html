<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FinAP — Конвертер валют</title>

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/currency-converter.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

<main class="currency-page">

    <div class="currency-top">

        <div>
            <div class="currency-label">FINAP TOOLS</div>

            <h1>Конвертер валют</h1>

            <p>
                Конвертація валют за офіційним курсом НБУ
            </p>
        </div>

        <a href="tools.html" class="currency-back">
            ← ДО ІНСТРУМЕНТІВ
        </a>

    </div>


    <section class="converter-card">

        <div class="converter-title">
            <span>КОНВЕРТАЦІЯ</span>
            <span class="nbu-status">● КУРС НБУ</span>
        </div>


        <div class="amount-block">

            <label for="currencyAmount">
                Сума
            </label>

            <input
                id="currencyAmount"
                type="number"
                value="100"
                min="0"
                step="0.01"
            >

        </div>


        <div class="currency-row">


            <div class="currency-select">

                <label>З валюти</label>

                <select id="fromCurrency">

                    <option value="UAH">UAH — Гривня</option>
                    <option value="USD" selected>USD — Долар США</option>
                    <option value="EUR">EUR — Євро</option>
                    <option value="GBP">GBP — Фунт стерлінгів</option>
                    <option value="PLN">PLN — Злотий</option>
                    <option value="CHF">CHF — Швейцарський франк</option>
                    <option value="CAD">CAD — Канадський долар</option>
                    <option value="CZK">CZK — Чеська крона</option>

                </select>

            </div>


            <button
                id="swapCurrency"
                class="swap-button"
                type="button"
                title="Поміняти валюти місцями"
            >
                ⇄
            </button>


            <div class="currency-select">

                <label>У валюту</label>

                <select id="toCurrency">

                    <option value="UAH" selected>UAH — Гривня</option>
                    <option value="USD">USD — Долар США</option>
                    <option value="EUR">EUR — Євро</option>
                    <option value="GBP">GBP — Фунт стерлінгів</option>
                    <option value="PLN">PLN — Злотий</option>
                    <option value="CHF">CHF — Швейцарський франк</option>
                    <option value="CAD">CAD — Канадський долар</option>
                    <option value="CZK">CZK — Чеська крона</option>

                </select>

            </div>

        </div>


        <div class="result-box">

            <div class="result-label">
                РЕЗУЛЬТАТ
            </div>

            <div
                id="conversionResult"
                class="result-value"
            >
                --
            </div>

            <div
                id="rateInfo"
                class="rate-info"
            >
                Завантаження курсу...
            </div>

        </div>


        <div class="converter-footer">

            <span id="rateDate">
                Курс завантажується...
            </span>

            <span>
                Джерело: НБУ
            </span>

        </div>

    </section>

</main>


<script src="js/currency-converter.js"></script>

</body>

</html>
