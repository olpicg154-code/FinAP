<section class="glossary-section">

    <div class="glossary-topbar">

        <div class="glossary-label">
            FINAP GLOSSARY
        </div>

        <a href="#" class="glossary-home">
            <span class="home-arrow">←</span>
            <span>НА ГОЛОВНУ</span>
        </a>

    </div>

    <div class="glossary-header">

        <div class="glossary-title">

            <h2>Фінансові визначення</h2>

            <p>
                Ключові терміни фінансів, комплаєнсу та фінансового моніторингу
            </p>

        </div>

        <div class="glossary-search">

            <span>⌕</span>

            <input
                type="text"
                id="glossarySearch"
                placeholder="Пошук терміна..."
                autocomplete="off"
            >

        </div>

    </div>

    <div class="glossary-layout">

        <div
            class="glossary-terms"
            id="glossaryTerms"
        ></div>

        <div
            class="glossary-definition"
            id="glossaryDefinition"
        >

            <div class="definition-empty">

                <div class="definition-icon">A</div>

                <h3>Оберіть термін</h3>

                <p>
                    Натисніть на будь-який термін,
                    щоб переглянути його визначення.
                </p>

            </div>

        </div>

    </div>

</section>
