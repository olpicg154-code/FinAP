<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinAP — Зміна показника</title>

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/currency-converter.css">
</head>

<body>

<main class="currency-page">

    <div class="currency-top">

        <div>
            <div class="currency-label">FINAP TOOLS</div>
            <h1>Зміна показника</h1>
            <p>Розрахунок відсоткової зміни значення</p>
        </div>

        <a href="tools.html" class="currency-back">
            ← ДО ІНСТРУМЕНТІВ
        </a>

    </div>


    <section class="converter-card">

        <div class="converter-title">
            <span>РОЗРАХУНОК</span>
            <span class="nbu-status">● FINAP TOOL</span>
        </div>


        <div class="currency-row">

            <div class="currency-select">
                <label>Було</label>
                <input id="oldValue" type="number" placeholder="100">
            </div>

            <div></div>

            <div class="currency-select">
                <label>Стало</label>
                <input id="newValue" type="number" placeholder="120">
            </div>

        </div>


        <div class="result-box">

            <div class="result-label">ЗМІНА</div>

            <div id="changeResult" class="result-value">
                --
            </div>

            <div id="changeText" class="rate-info">
                Введіть дані
            </div>

        </div>

    </section>

</main>

<script src="js/percent-change.js"></script>

</body>
</html>
