name: FinAP News Engine

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install rss-parser

      - name: Run news engine
        run: node news.js

      - name: Commit results
        run: |
          git config user.name "finap-bot"
          git config user.email "bot@finap.com"
          git add news.json
          git commit -m "update news" || exit 0
          git push
