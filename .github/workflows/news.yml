name: FinAP News Engine

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install RSS parser
        run: npm install rss-parser

      - name: Generate news.json
        run: node -e "
        const Parser = require('rss-parser');
        const fs = require('fs');
        const parser = new Parser();

        const sources = [
          'https://bank.gov.ua/rss/news',
          'https://minfin.com.ua/ua/rss/',
          'https://liga.net/news/rss.xml'
        ];

        const keywords = ['банк','НБУ','подат','санкц'];

        function isRelevant(title){
          return keywords.some(k => title.toLowerCase().includes(k));
        }

        (async () => {
          let all = [];

          for (let url of sources) {
            try {
              const feed = await parser.parseURL(url);

              feed.items.forEach(i => {
                if (isRelevant(i.title)) {
                  all.push({
                    title: i.title,
                    link: i.link,
                    date: i.pubDate,
                    isNew: true
                  });
                }
              });

            } catch(e){}
          }

          all = all.slice(0,10);

          fs.writeFileSync('news.json', JSON.stringify(all, null, 2));
          console.log('NEWS UPDATED');
        })();
        "

      - name: Commit results
        run: |
          git config user.name "finap-bot"
          git config user.email "bot@finap.com"
          git add news.json
          git commit -m "update news" || exit 0
          git push
