<!DOCTYPE html>
<html lang="uk">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FinAP — Financial Intelligence</title>

  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/hero.css">
  <link rel="stylesheet" href="css/buttons.css">
  <link rel="stylesheet" href="css/glossary.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/market-data.css">
  <link rel="stylesheet" href="css/social.css">
  <link rel="stylesheet" href="css/trust.css">
  <link rel="stylesheet" href="css/tg.css">

</head>

<body>

  <!-- 🔴 NEWS TICKER -->
  <div class="finap-ticker">
    <div class="ticker-badge">FINAP NEWS</div>
    <div class="ticker-track-wrapper">
      <div id="ticker" class="ticker-track"></div>
    </div>
  </div>

  <!-- 🔵 QUIZ BUTTON -->
  <div style="position:fixed;top:60px;right:20px;z-index:9999;">
    <a href="quiz.html" class="finap-btn quiz-btn">
      ТЕСТИ
    </a>
  </div>

  <!-- 🟣 PHOTO NEWS BUTTON -->
  <div style="position:fixed;top:100px;right:20px;z-index:9999;">
    <a href="photo-news.html" class="finap-btn photo-btn">
      ФОТО
    </a>
  </div>

  <div id="app">

    <header id="header"></header>

    <main>

      <section id="hero"></section>

      <section id="definitions"></section>

      <div id="trust-container"></div>

      <section id="market-data"></section>

    </main>

    <footer id="footer"></footer>

  </div>

  <script type="module" src="js/main.js"></script>

  <!-- TICKER -->
  <script>
    async function loadTicker() {
      try {
        const res = await fetch("news.json");
        const data = await res.json();

        const ticker = document.getElementById("ticker");
        if (!ticker) return;

        ticker.innerHTML = data.map(n => `● ${n.title}`).join(" | ");

      } catch (e) {
        console.log("Ticker error:", e.message);
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      loadTicker();
      setInterval(loadTicker, 60000);
    });
  </script>

  <!-- TRUST -->
  <script>
    fetch("trust.html")
      .then(r => r.text())
      .then(html => {
        document.getElementById("trust-container").innerHTML = html;
      });
  </script>

  <script src="js/tg.js"></script>

</body>

</html>
