<!DOCTYPE html>
<html lang="uk">

<head>

    <title>FinAP — Фінансова карта Рівного</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #07111f;
            font-family: Arial, sans-serif;
        }

        #map {
            position: fixed;
            inset: 0;
        }

        .toolbar {
            position: fixed;
            top: 18px;
            left: 18px;
            right: 18px;
            z-index: 5000;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            pointer-events: none;
        }

        .toolbar-left,

            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            pointer-events: auto;
        }

        .btn {
            min-height: 42px;
            padding: 0 14px;
            border-radius: 12px;

            background: rgba(7,17,31,.94);
            color: white;

            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(14px);
            box-shadow: 0 8px 24px rgba(0,0,0,.3);
            transition: .2s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
            border-color: rgba(255,255,255,.28);
        }

        .location-btn {
            color: #5ee7c4;
            border-color: rgba(16,185,129,.4);
        }

        .bank-btn {
            color: #8fd8ff;
            border-color: rgba(56,189,248,.4);
        }

        .exchange-btn {
            color: #f6d56f;
            border-color: rgba(234,179,8,.4);
        }

        .court-btn {
            color: #fca5a5;
            border-color: rgba(239,68,68,.4);
        }

        .cnap-btn {
            color: #c4b5fd;
            border-color: rgba(139,92,246,.4);
        }

        .panel {
            position: fixed;
            top: 76px;
            right: 18px;
            z-index: 5100;
            width: 370px;
            max-width: calc(100vw - 36px);
            max-height: calc(100vh - 105px);
            display: none;
            flex-direction: column;
            overflow: hidden;

            border: 1px solid rgba(255,255,255,.12);
            border-radius: 16px;

            background: rgba(7,17,31,.96);
            backdrop-filter: blur(18px);

            box-shadow: 0 18px 50px rgba(0,0,0,.45);
        }

        .panel.open {
            display: flex;
        }

        .panel-header {
            padding: 16px;
            border-bottom: 1px solid rgba(255,255,255,.08);
        }

        .panel-title {
            margin: 0 0 10px;
            color: white;
            font-size: 17px;
        }

        .search {
            width: 100%;
            height: 40px;
            padding: 0 12px;

            border-radius: 10px;
            border: 1px solid rgba(255,255,255,.12);

            outline: none;

            background: rgba(255,255,255,.06);
            color: white;
        }

        .search::placeholder {
            color: rgba(255,255,255,.45);
        }

        .list {
            padding: 8px;
            overflow-y: auto;
        }

        .item {
            width: 100%;
            padding: 12px;
            margin-bottom: 6px;

            text-align: left;

            border: 1px solid transparent;
            border-radius: 10px;

            background: rgba(255,255,255,.04);
            color: white;

            cursor: pointer;
            transition: .2s ease;
        }

        .item:hover {
            background: rgba(255,255,255,.08);
            border-color: rgba(255,255,255,.2);
        }

        .item-name {
            display: block;
            font-size: 13px;
            font-weight: 600;
        }

        .item-address {
            display: block;
            margin-top: 5px;

            color: rgba(255,255,255,.56);

            font-size: 11px;
            line-height: 1.4;
        }

        .verified {
            display: inline-block;
            margin-top: 7px;
            padding: 3px 6px;

            border-radius: 5px;

            color: #f6d56f;
            background: rgba(234,179,8,.08);

            border: 1px solid rgba(234,179,8,.2);

            font-size: 9px;
        }

        .status {
            position: fixed;
            left: 50%;
            bottom: 22px;

            transform: translateX(-50%);

            z-index: 5200;

            width: min(92vw, 720px);

            padding: 13px 16px;

            border-radius: 12px;

            background: rgba(7,17,31,.96);

            border: 1px solid rgba(255,255,255,.1);

            color: #e5e7eb;

            text-align: center;

            font-size: 13px;
            line-height: 1.4;

            box-shadow: 0 10px 30px rgba(0,0,0,.35);

            backdrop-filter: blur(14px);
        }

        .status.hidden {
            display: none;
        }

        .user-marker,
        .bank-marker,
        .exchange-marker,
        .court-marker,
        .cnap-marker {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 30px;
            height: 30px;

            border-radius: 50%;

            background: #0b1e32;

            font-weight: 700;
            font-size: 14px;
        }

        .user-marker {
            width: 18px;
            height: 18px;

            background: #10b981;

            border: 3px solid white;

            box-shadow:
                0 0 0 8px rgba(16,185,129,.18),
                0 0 22px rgba(16,185,129,.7);
        }

        .bank-marker {
            color: #8fd8ff;

            border: 2px solid #38bdf8;

            box-shadow:
                0 0 14px rgba(56,189,248,.5);
        }

        .exchange-marker {
            color: #f6d56f;

            border: 2px solid #eab308;

            box-shadow:
                0 0 14px rgba(234,179,8,.45);
        }

        .court-marker {
            color: #fca5a5;

            border: 2px solid #ef4444;

            box-shadow:
                0 0 14px rgba(239,68,68,.45);
        }

        .cnap-marker {
            color: #c4b5fd;

            border: 2px solid #8b5cf6;

            box-shadow:
                0 0 14px rgba(139,92,246,.45);
        }

        .popup-title {
            font-size: 14px;
            font-weight: 700;

        }

        .popup-address {
            color: #555;
            font-size: 12px;

            margin-bottom: 8px;
        }

        .popup-source {
            color: #777;

            margin-bottom: 9px;
        }

        .route {
            display: inline-block;

            border-radius: 7px;

            color: white;

            font-size: 11px;

        }

        @media (max-width: 1050px) {

            .toolbar {
                flex-direction: column;
            }

                top: 125px;
            }
        }

        @media (max-width: 650px) {

            .toolbar {

                left: 10px;

            }

                right: 10px;
                width: calc(100vw - 20px);

        }
    </style>
</head>

    <script>

        /*

         */

        let accuracyCircle = null;

            },

            {

            },

            {

            },

            {

                lon: 26.265080,

        /*

            },

            {

            },

            {

                    "Рівненський апеляційний суд",

                address:
                    "Рівне, вул. Михайла Драгоманова, 9",

                lat: 50.615282,
                lon: 26.251485
            },

            {
                name:
                    "Північно-західний апеляційний господарський суд",

                address:
                    "Рівне, вул. Яворницького, 59",

                lat: 50.612700,

            },

        /*

         */

        const CNAP = [

                    "Рівне, майдан Просвіти, 2",

                lat: 50.626160,
                lon: 26.252990
            },

            {

                lat: 50.625700,
                lon: 26.188700
            },

            {
                name:

                address:
                    "Рівне, вул. Кулика і Гудачека, 3",

                lat: 50.634750,
                lon: 26.198590
            },

            {

                    "ЦНАП — Бізнес-коворкінг",

                address:
                    "Рівне, вул. Поштова, 2",

                lat: 50.620500,
                lon: 26.250800
            },

            {
                name:
                    "ЦНАП — віддалене робоче місце",

                address:
                    "Рівне, вул. Медична, 7",

                lat: 50.611800,
                lon: 26.253800
            },

            {
                name:
                    "ЦНАП — Квасилів",

                address:
                    "Квасилів, вул. Рівненська, 1",

                lat: 50.556700,
                lon: 26.264600
            }

        ];

        /*
         * =====================================================
         * ПАНЕЛІ
         * =====================================================
         */

        const panels = {
            bank:
                document.getElementById(
                    "bankPanel"
                ),

            exchange:
                document.getElementById(
                    "exchangePanel"
                ),

            court:
                document.getElementById(
                    "courtPanel"
                ),

            cnap:
                document.getElementById(
                    "cnapPanel"
                )
        };

        const lists = {
            bank:
                document.getElementById(
                    "bankList"
                ),

            exchange:
                document.getElementById(
                    "exchangeList"
                ),

            court:
                document.getElementById(
                    "courtList"
                ),

            cnap:
                document.getElementById(
                    "cnapList"
                )
        };

        /*
         * =====================================================
         * ФУНКЦІЇ
         * =====================================================
         */

        function status(text) {

            const box =
                document.getElementById(
                    "status"
                );

            box.textContent =
                text;

            box.classList.remove(
                "hidden"
            );
        }

        function hideStatus() {

            document
                .getElementById(
                    "status"
                )
                .classList.add(
                    "hidden"
                );
        }

        function escapeHtml(value) {

            return String(value)
                .replaceAll(
                    "&",
                    "&amp;"
                )
                .replaceAll(
                    "<",
                    "&lt;"
                )
                .replaceAll(
                    ">",
                    "&gt;"
                )
                .replaceAll(
                    '"',
                    "&quot;"
                )
                .replaceAll(
                    "'",
                    "&#039;"
                );
        }

        function route(
            lat,
            lon
        ) {

            return (
                "https://www.google.com/maps/dir/?api=1&destination=" +
                encodeURIComponent(
                    lat +
                    "," +
                    lon
                )
            );
        }

        function closePanels() {

            Object
                .values(
                    panels
                )
                .forEach(
                    p =>
                        p.classList.remove(
                            "open"
                        )
                );
        }

        function clearMarkers() {

            bankMarkers.forEach(
                m =>
                    map.removeLayer(
                        m
                    )
            );

            exchangeMarkers.forEach(
                m =>
                    map.removeLayer(
                        m
                    )
            );

            courtMarkers.forEach(
                m =>
                    map.removeLayer(
                        m
                    )
            );

            cnapMarkers.forEach(
                m =>
                    map.removeLayer(
                        m
                    )
            );

            bankMarkers = [];
            exchangeMarkers = [];
            courtMarkers = [];
            cnapMarkers = [];
        }

        function userIcon() {

            return L.divIcon({

                className: "",

                html:
                    '<div class="user-marker"></div>',

                iconSize:
                    [18,18],

                iconAnchor:
                    [9,9]
            });
        }

        function bankIcon() {

            return L.divIcon({

                className: "",

                html:
                    '<div class="bank-marker">₴</div>',

                iconSize:
                    [30,30],

                iconAnchor:
                    [15,15]
            });
        }

        function exchangeIcon() {

            return L.divIcon({

                className: "",

                html:
                    '<div class="exchange-marker">₴</div>',

                iconSize:
                    [30,30],

                iconAnchor:
                    [15,15]
            });
        }

        function courtIcon() {

            return L.divIcon({

                className: "",

                html:
                    '<div class="court-marker">⚖</div>',

                iconSize:
                    [30,30],

                iconAnchor:
                    [15,15]
            });
        }

        function cnapIcon() {

            return L.divIcon({

                className: "",

                html:
                    '<div class="cnap-marker">🏛</div>',

                iconSize:
                    [30,30],

                iconAnchor:
                    [15,15]
            });
        }

        function popup(
            marker,
            place
        ) {

            const source =
                place.source
                    ? `
                        <div class="popup-source">
                            Джерело:
                            ${escapeHtml(
                                place.source
                            )}
                        </div>
                      `
                    : "";

            marker.bindPopup(`

                <div class="popup-title">
                    ${escapeHtml(
                        place.name
                    )}
                </div>

                <div class="popup-address">
                    ${escapeHtml(
                        place.address ||
                        "Адреса не вказана в даних карти"
                    )}
                </div>

                ${source}

                <a
                    class="route"
                    href="${route(
                        place.lat,
                        place.lon
                    )}"
                    target="_blank"
                    rel="noopener"
                >
                    Маршрут →
                </a>

            `);
        }

        /*
         * =====================================================
         * OVERPASS
         * =====================================================
         */

        async function overpass(
            query
        ) {

            let lastError =
                null;

            for (
                const endpoint of
                [
                    "https://overpass-api.de/api/interpreter",
                    "https://overpass.kumi.systems/api/interpreter",
                    "https://overpass.private.coffee/api/interpreter"
                ]
            ) {

                try {

                    const response =
                        await fetch(
                            endpoint,
                            {
                                method:
                                    "POST",

                                headers: {
                                    "Content-Type":
                                        "application/x-www-form-urlencoded"
                                },

                                body:
                                    "data=" +
                                    encodeURIComponent(
                                        query
                                    )
                            }
                        );

                    if (
                        response.ok
                    ) {

                        return await response.json();
                    }

                    lastError =
                        new Error(
                            "HTTP " +
                            response.status
                        );

                } catch (
                    error
                ) {

                    lastError =
                        error;
                }
            }

            throw (
                lastError ||
                new Error(
                    "Overpass unavailable"
                )
            );
        }

        function osmPlaces(
            elements,
            fallback
        ) {

            return elements
                .map(
                    el => {

                        const lat =
                            el.lat ??
                            el.center?.lat;

                        const lon =
                            el.lon ??
                            el.center?.lon;

                        const tags =
                            el.tags ||
                            {};

                        if (
                            typeof lat !==
                                "number" ||
                            typeof lon !==
                                "number"
                        ) {

                            return null;
                        }

                        return {

                            name:
                                tags.name ||
                                tags.brand ||
                                tags.operator ||
                                fallback,

                            address:
                                [
                                    tags["addr:street"],
                                    tags["addr:housenumber"]
                                ]
                                .filter(
                                    Boolean
                                )
                                .join(
                                    ", "
                                ),

                            lat,
                            lon,

                            source:
                                "OpenStreetMap"
                        };
                    }
                )
                .filter(
                    Boolean
                );
        }

        /*
         * =====================================================
         * БАНКИ
         * =====================================================
         */

        async function showBanks() {

            activeCategory =
                "bank";

            const current =
                ++operationId;

            clearMarkers();
            closePanels();

            panels.bank.classList.add(
                "open"
            );

            lists.bank.innerHTML =
                `
                    <div style="padding:15px;color:#aaa">
                        Завантаження банків...
                    </div>
                `;

            status(
                "Завантажую банки Рівного..."
            );

            const query = `

                [out:json][timeout:30];

                (
                    node["amenity"="bank"]
                    (50.57,26.15,50.68,26.38);

                    way["amenity"="bank"]
                    (50.57,26.15,50.68,26.38);

                    relation["amenity"="bank"]
                    (50.57,26.15,50.68,26.38);
                );

                out center tags;
            `;

            try {

                const data =
                    await overpass(
                        query
                    );

                if (
                    current !==
                        operationId
                ) {

                    return;
                }

                bankData =
                    osmPlaces(
                        data.elements,
                        "Банк"
                    );

                bankData.sort(
                    (a,b) =>
                        a.name.localeCompare(
                            b.name,
                            "uk"
                        )
                );

                bankData.forEach(
                    place => {

                        const marker =
                            L.marker(
                                [
                                    place.lat,
                                    place.lon
                                ],
                                {
                                    icon:
                                        bankIcon()
                                }
                            )
                            .addTo(map);

                        popup(
                            marker,
                            place
                        );

                        bankMarkers.push(
                            marker
                        );
                    }
                );

                render(
                    lists.bank,
                    bankData,
                    "bank"
                );

                status(
                    "Знайдено " +
                    bankData.length +
                    " банків у Рівному."
                );

            } catch (
                error
            ) {

                console.error(
                    "BANKS:",
                    error
                );

                lists.bank.innerHTML =
                    `
                        <div style="padding:15px;color:#aaa">
                            Не вдалося завантажити банки.
                            Спробуйте натиснути «Банки» ще раз.
                        </div>
                    `;

                status(
                    "Не вдалося отримати дані банків."
                );
            }
        }

        /*
         * =====================================================
         * ОБМІННИКИ
         * =====================================================
         */

        async function showExchanges() {

            activeCategory =
                "exchange";

            const current =
                ++operationId;

            clearMarkers();
            closePanels();

            panels.exchange.classList.add(
                "open"
            );

            lists.exchange.innerHTML =
                `
                    <div style="padding:15px;color:#aaa">
                        Завантаження обмінників...
                    </div>
                `;

            status(
                "Завантажую обмінники Рівного..."
            );

            const query = `

                [out:json][timeout:30];

                (
                    node["amenity"="bureau_de_change"]
                    (50.57,26.15,50.68,26.38);

                    way["amenity"="bureau_de_change"]
                    (50.57,26.15,50.68,26.38);

                    relation["amenity"="bureau_de_change"]
                    (50.57,26.15,50.68,26.38);
                );

                out center tags;
            `;

            let osm = [];

            try {

                const data =
                    await overpass(
                        query
                    );

                osm =
                    osmPlaces(
                        data.elements,
                        "Обмінник"
                    );

            } catch (
                error
            ) {

                console.warn(
                    "EXCHANGES:",
                    error
                );
            }

            if (
                current !==
                    operationId
            ) {

                return;
            }

            exchangeData = [
                ...osm,
                ...LION
            ];

            exchangeData.forEach(
                place => {

                    const marker =
                        L.marker(
                            [
                                place.lat,
                                place.lon
                            ],
                            {
                                icon:
                                    exchangeIcon()
                            }
                        )
                        .addTo(map);

                    popup(
                        marker,
                        place
                    );

                    exchangeMarkers.push(
                        marker
                    );
                }
            );

            render(
                lists.exchange,
                exchangeData,
                "exchange"
            );

            const lionCount =
                LION.length;

            const osmCount =
                osm.length;

            status(
                "Знайдено " +
                exchangeData.length +
                " обмінників. " +
                "OSM: " +
                osmCount +
                ", LION KURS: " +
                lionCount +
                "."
            );
        }

        /*
         * =====================================================
         * СУДИ
         * =====================================================
         */

        function showCourts() {

            activeCategory =
                "court";

            ++operationId;

            clearMarkers();
            closePanels();

            panels.court.classList.add(
                "open"
            );

            COURTS.forEach(
                place => {

                    const marker =
                        L.marker(
                            [
                                place.lat,
                                place.lon
                            ],
                            {
                                icon:
                                    courtIcon()
                            }
                        )
                        .addTo(map);

                    popup(
                        marker,
                        place
                    );

                    courtMarkers.push(
                        marker
                    );
                }
            );

            render(
                lists.court,
                COURTS,
                "court"
            );

            status(
                "Знайдено " +
                COURTS.length +
                " судів у Рівному."
            );
        }

        /*
         * =====================================================
         * ЦНАП
         * =====================================================
         */

        function showCnap() {

            activeCategory =
                "cnap";

            ++operationId;

            clearMarkers();
            closePanels();

            panels.cnap.classList.add(
                "open"
            );

            CNAP.forEach(
                place => {

                    const marker =
                        L.marker(
                            [
                                place.lat,
                                place.lon
                            ],
                            {
                                icon:
                                    cnapIcon()
                            }
                        )
                        .addTo(map);

                    popup(
                        marker,
                        place
                    );

                    cnapMarkers.push(
                        marker
                    );
                }
            );

            render(
                lists.cnap,
                CNAP,
                "cnap"
            );

            status(
                "Знайдено " +
                CNAP.length +
                " точок ЦНАП."
            );
        }

        /*
         * =====================================================
         * ВИБІР ОДНОГО ОБ'ЄКТА
         * =====================================================
         */

        function selectOne(
            place,
            type
        ) {

            activeCategory =
                type;

            ++operationId;

            clearMarkers();
            closePanels();

            let icon;

            if (
                type === "bank"
            ) {
                icon =
                    bankIcon();
            }

            if (
                type === "exchange"
            ) {
                icon =
                    exchangeIcon();
            }

            if (
                type === "court"
            ) {
                icon =
                    courtIcon();
            }

            if (
                type === "cnap"
            ) {
                icon =
                    cnapIcon();
            }

            const marker =
                L.marker(
                    [
                        place.lat,
                        place.lon
                    ],
                    {
                        icon
                    }
                )
                .addTo(map);

            popup(
                marker,
                place
            );

            map.setView(
                [
                    place.lat,
                    place.lon
                ],
                16
            );

            marker.openPopup();
        }

        /*
         * =====================================================
         * РЕНДЕР СПИСКУ
         * =====================================================
         */

        function render(
            container,
            items,
            type
        ) {

            container.innerHTML =
                "";

            if (
                !items.length
            ) {

                container.innerHTML =
                    `
                        <div style="padding:15px;color:#aaa">
                            Нічого не знайдено.
                        </div>
                    `;

                return;
            }

            items.forEach(
                place => {

                    const button =
                        document.createElement(
                            "button"
                        );

                    button.className =
                        "item";

                    button.type =
                        "button";

                    const verified =
                        place.source ===
                        "LION"

                            ? `
                                <span class="verified">
                                    перевірено
                                </span>
                              `
                            : "";

                    button.innerHTML =
                        `
                            <span
                                class="item-name">

                                ${
                                    escapeHtml(
                                        place.name
                                    )
                                }

                            </span>

                            <span
                                class="item-address">

                                ${
                                    escapeHtml(
                                        place.address ||
                                        "Адресу не внесено в OSM"
                                    )
                                }

                            </span>

                            ${verified}

                        `;

                    button.onclick =
                        () =>
                            selectOne(
                                place,
                                type
                            );

                    container.appendChild(
                        button
                    );
                }
            );
        }

        /*
         * =====================================================
         * ПОШУК
         * =====================================================
         */

        function connectSearch(
            input,
            source,
            container,
            type
        ) {

            input.addEventListener(
                "input",
                () => {

                    const value =
                        input.value
                            .trim()
                            .toLowerCase();

                    const result =
                        source.filter(
                            item =>
                                item.name
                                    .toLowerCase()
                                    .includes(
                                        value
                                    ) ||

                                item.address
                                    .toLowerCase()
                                    .includes(
                                        value
                                    )
                        );

                    render(
                        container,
                        result,
                        type
                    );
                }
            );
        }

        connectSearch(
            document.getElementById(
                "bankSearch"
            ),
            () =>
                bankData,
            document.getElementById(
                "bankList"
            ),
            "bank"
        );

        connectSearch(
            document.getElementById(
                "exchangeSearch"
            ),
            () =>
                exchangeData,
            document.getElementById(
                "exchangeList"
            ),
            "exchange"
        );

        connectSearch(
            document.getElementById(
                "courtSearch"
            ),
            () =>
                COURTS,
            document.getElementById(
                "courtList"
            ),
            "court"
        );

        connectSearch(
            document.getElementById(
                "cnapSearch"
            ),
            () =>
                CNAP,
            document.getElementById(
                "cnapList"
            ),
            "cnap"
        );

        /*
         * =====================================================
         * КНОПКИ
         * =====================================================
         */

        document
            .getElementById(
                "bankButton"
            )
            .onclick =
                showBanks;

        document
            .getElementById(
                "exchangeButton"
            )
            .onclick =
                showExchanges;

        document
            .getElementById(
                "courtButton"
            )
            .onclick =
                showCourts;

        document
            .getElementById(
                "cnapButton"
            )
            .onclick =
                showCnap;

        /*
         * =====================================================
         * ГЕОЛОКАЦІЯ
         * =====================================================
         */

        document
            .getElementById(
                "locationButton"
            )
            .onclick =
                () => {

                    if (
                        !navigator.geolocation
                    ) {

                        status(
                            "Ваш браузер не підтримує геолокацію."
                        );

                        return;
                    }

                    status(
                        "Визначаю вашу локацію..."
                    );

                    navigator
                        .geolocation
                        .getCurrentPosition(

                            position => {

                                const lat =
                                    position
                                        .coords
                                        .latitude;

                                const lon =
                                    position
                                        .coords
                                        .longitude;

                                const accuracy =
                                    position
                                        .coords
                                        .accuracy;

                                map.setView(
                                    [
                                        lat,
                                        lon
                                    ],
                                    16
                                );

                                if (
                                    userMarker
                                ) {

                                    map.removeLayer(
                                        userMarker
                                    );
                                }

                                if (
                                    accuracyCircle
                                ) {

                                    map.removeLayer(
                                        accuracyCircle
                                    );
                                }

                                userMarker =
                                    L.marker(
                                        [
                                            lat,
                                            lon
                                        ],
                                        {
                                            icon:
                                                userIcon()
                                        }
                                    )
                                    .addTo(map)
                                    .bindPopup(
                                        "📍 Ви тут"
                                    )
                                    .openPopup();

                                accuracyCircle =
                                    L.circle(
                                        [
                                            lat,
                                            lon
                                        ],
                                        {
                                            radius:
                                                accuracy,

                                            color:
                                                "#10b981",

                                            fillColor:
                                                "#10b981",

                                            fillOpacity:
                                                .08,

                                            weight: 1
                                        }
                                    )
                                    .addTo(map);

                                status(
                                    "Локацію визначено. " +
                                    "Точність приблизно " +
                                    Math.round(
                                        accuracy
                                    ) +
                                    " м."
                                );

                                setTimeout(
                                    hideStatus,
                                    5000
                                );
                            },

                            error => {

                                if (
                                    error.code === 1
                                ) {

                                    status(
                                        "Доступ до геолокації заборонено."
                                    );

                                } else if (
                                    error.code === 2
                                ) {

                                    status(
                                        "Не вдалося визначити координати."
                                    );

                                } else {

                                    status(
                                        "Час очікування геолокації вичерпано."
                                    );
                                }
                            },

                            {
                                enableHighAccuracy:
                                    true,

                                timeout:
                                    30000,

                                maximumAge:
                                    0
                            }
                        );
                };

    </script>

</body>
</html>
