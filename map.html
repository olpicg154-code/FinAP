<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FinAP — Фінансова карта Рівного</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #07111f;
            font-family: Arial, sans-serif;
        }

        #map {
            position: absolute;
            inset: 0;
        }

        .toolbar {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            z-index: 2000;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
        }

        .toolbar-left,
        .toolbar-right {
            display: flex;
            gap: 8px;
            pointer-events: auto;
            flex-wrap: wrap;
        }

        .btn {
            min-height: 42px;
            padding: 0 15px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,.12);
            background: rgba(7,17,31,.93);
            color: #fff;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 8px 24px rgba(0,0,0,.30);
            transition: .2s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
            border-color: rgba(255,255,255,.25);
        }

        .location-btn {
            color: #5ee7c4;
            border-color: rgba(16,185,129,.4);
        }

        .bank-btn {
            color: #8fd8ff;
            border-color: rgba(56,189,248,.4);
        }

        .exchange-btn {
            color: #f6d56f;
            border-color: rgba(234,179,8,.4);
        }

        .panel {
            position: fixed;
            top: 78px;
            right: 20px;
            z-index: 2100;
            width: 350px;
            max-width: calc(100vw - 40px);
            max-height: calc(100vh - 110px);
            overflow: hidden;
            display: none;
            flex-direction: column;
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 16px;
            background: rgba(7,17,31,.95);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow: 0 18px 50px rgba(0,0,0,.45);
        }

        .panel.open {
            display: flex;
        }

        .panel-header {
            padding: 16px;
            border-bottom: 1px solid rgba(255,255,255,.08);
        }

        .panel-title {
            margin: 0 0 10px;
            color: #fff;
            font-size: 17px;
        }

        .search {
            width: 100%;
            height: 40px;
            padding: 0 12px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,.12);
            outline: none;
            background: rgba(255,255,255,.06);
            color: #fff;
            font-size: 13px;
        }

        .search::placeholder {
            color: rgba(255,255,255,.45);
        }

        .item-list {
            overflow-y: auto;
            padding: 8px;
        }

        .item {
            width: 100%;
            padding: 12px;
            margin-bottom: 6px;
            text-align: left;
            border: 1px solid transparent;
            border-radius: 10px;
            background: rgba(255,255,255,.04);
            color: #fff;
            cursor: pointer;
        }

        .item:hover {
            border-color: rgba(255,255,255,.20);
            background: rgba(255,255,255,.08);
        }

        .item-name {
            display: block;
            font-size: 13px;
            font-weight: 600;
        }

        .item-address {
            display: block;
            margin-top: 4px;
            color: rgba(255,255,255,.52);
            font-size: 11px;
        }

        .item-source {
            display: inline-block;
            margin-top: 7px;
            padding: 3px 6px;
            border-radius: 5px;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: .4px;
            color: #f6d56f;
            background: rgba(234,179,8,.08);
            border: 1px solid rgba(234,179,8,.18);
        }

        .status {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%);
            z-index: 3000;
            width: min(92vw, 650px);
            padding: 13px 16px;
            border-radius: 12px;
            background: rgba(7,17,31,.95);
            border: 1px solid rgba(255,255,255,.10);
            color: #e5e7eb;
            text-align: center;
            font-size: 13px;
            line-height: 1.4;
            box-shadow: 0 10px 30px rgba(0,0,0,.35);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        .status.hidden {
            display: none;
        }

        .user-marker {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #10b981;
            border: 3px solid #fff;
            box-shadow:
                0 0 0 8px rgba(16,185,129,.18),
                0 0 22px rgba(16,185,129,.70);
        }

        .bank-marker,
        .exchange-marker {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b1e32;
            font-size: 14px;
            font-weight: 700;
        }

        .bank-marker {
            color: #8fd8ff;
            border: 2px solid #38bdf8;
            box-shadow: 0 0 14px rgba(56,189,248,.50);
        }

        .exchange-marker {
            color: #f6d56f;
            border: 2px solid #eab308;
            box-shadow: 0 0 14px rgba(234,179,8,.45);
        }

        .verified-marker {
            color: #ffffff;
            border-color: #f6d56f;
        }

        .leaflet-popup-content {
            min-width: 210px;
        }

        .popup-title {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .popup-address {
            color: #555;
            font-size: 12px;
            margin-bottom: 9px;
        }

        .popup-source {
            color: #777;
            font-size: 10px;
            margin-bottom: 9px;
        }

        .route-btn {
            display: inline-block;
            padding: 7px 10px;
            border-radius: 7px;
            background: #07111f;
            color: #fff;
            text-decoration: none;
            font-size: 11px;
            font-weight: 600;
        }

        @media (max-width: 850px) {
            .toolbar {
                flex-direction: column;
                gap: 8px;
            }

            .toolbar-right {
                max-width: 100%;
            }

            .panel {
                top: 124px;
            }
        }

        @media (max-width: 650px) {
            .toolbar {
                top: 12px;
                left: 12px;
                right: 12px;
            }

            .btn {
                min-height: 38px;
                padding: 0 11px;
                font-size: 11px;
            }

            .panel {
                top: 118px;
                right: 12px;
                width: calc(100vw - 24px);
                max-width: none;
            }
        }
    </style>
</head>

<body>

    <div class="toolbar">

        <div class="toolbar-left">
            <a href="index.html" class="btn">
                ← На головну
            </a>
        </div>

        <div class="toolbar-right">

            <button id="locationButton"
                    class="btn location-btn"
                    type="button">
                📍 Моя локація
            </button>

            <button id="banksButton"
                    class="btn bank-btn"
                    type="button">
                🏦 Банки
            </button>

            <button id="exchangeButton"
                    class="btn exchange-btn"
                    type="button">
                💱 Обмінники
            </button>

        </div>

    </div>

    <div id="bankPanel" class="panel">

        <div class="panel-header">
            <h2 class="panel-title">Банки Рівного</h2>

            <input id="bankSearch"
                   class="search"
                   type="text"
                   placeholder="Пошук банку..."
                   autocomplete="off">
        </div>

        <div id="bankList" class="item-list"></div>

    </div>

    <div id="exchangePanel" class="panel">

        <div class="panel-header">
            <h2 class="panel-title">Обмінники Рівного</h2>

            <input id="exchangeSearch"
                   class="search"
                   type="text"
                   placeholder="Пошук обмінника..."
                   autocomplete="off">
        </div>

        <div id="exchangeList" class="item-list"></div>

    </div>

    <div id="map"></div>

    <div id="status" class="status">
        Карта Рівного готова.
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>

        const RIVNE = [50.6199, 26.2516];

        const map = L.map("map").setView(RIVNE, 13);

        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 19,
                attribution: "&copy; OpenStreetMap contributors"
            }
        ).addTo(map);

        let userMarker = null;
        let accuracyCircle = null;

        let bankData = [];
        let exchangeData = [];

        let bankMarkers = [];
        let exchangeMarkers = [];

        const status =
            document.getElementById("status");

        const bankPanel =
            document.getElementById("bankPanel");

        const exchangePanel =
            document.getElementById("exchangePanel");

        const bankList =
            document.getElementById("bankList");

        const exchangeList =
            document.getElementById("exchangeList");

        const bankSearch =
            document.getElementById("bankSearch");

        const exchangeSearch =
            document.getElementById("exchangeSearch");

        function showStatus(text) {
            status.textContent = text;
            status.classList.remove("hidden");
        }

        function hideStatus() {
            status.classList.add("hidden");
        }

        function escapeHtml(value) {
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function normalizeName(name) {
            return name
                .toLowerCase()
                .replace(
                    /акціонерне товариство|публічне акціонерне товариство|товариство з обмеженою відповідальністю|ат|тзов|тов/g,
                    ""
                )
                .replace(
                    /[^а-яіїєґa-z0-9]+/gi,
                    " "
                )
                .trim();
        }

        function userIcon() {

            return L.divIcon({
                className: "",
                html:
                    '<div class="user-marker"></div>',
                iconSize: [18, 18],
                iconAnchor: [9, 9]
            });
        }

        function bankIcon() {

            return L.divIcon({
                className: "",
                html:
                    '<div class="bank-marker">₴</div>',
                iconSize: [30, 30],
                iconAnchor: [15, 15]
            });
        }

        function exchangeIcon(verified = false) {

            return L.divIcon({
                className: "",
                html:
                    '<div class="exchange-marker' +
                    (verified ? " verified-marker" : "") +
                    '">₴</div>',
                iconSize: [30, 30],
                iconAnchor: [15, 15]
            });
        }

        function routeUrl(lat, lon) {

            return (
                "https://www.google.com/maps/dir/?api=1&destination=" +
                encodeURIComponent(lat + "," + lon)
            );
        }

        function popupHtml(place) {

            const address =
                place.address
                    ? `<div class="popup-address">${escapeHtml(place.address)}</div>`
                    : "";

            const source =
                place.source
                    ? `<div class="popup-source">Джерело: ${escapeHtml(place.source)}</div>`
                    : "";

            return `
                <div class="popup-title">
                    ${escapeHtml(place.name)}
                </div>

                ${address}

                ${source}

                <a
                    class="route-btn"
                    href="${routeUrl(place.lat, place.lon)}"
                    target="_blank"
                    rel="noopener"
                >
                    Маршрут →
                </a>
            `;
        }

        /*
         * МОЯ ЛОКАЦІЯ
         */

        document
            .getElementById("locationButton")
            .addEventListener("click", () => {

                if (!navigator.geolocation) {

                    showStatus(
                        "Ваш браузер не підтримує геолокацію."
                    );

                    return;
                }

                showStatus(
                    "Визначаю вашу локацію..."
                );

                navigator.geolocation.getCurrentPosition(

                    position => {

                        const lat =
                            position.coords.latitude;

                        const lon =
                            position.coords.longitude;

                        const accuracy =
                            position.coords.accuracy;

                        map.setView(
                            [lat, lon],
                            16
                        );

                        if (userMarker) {
                            map.removeLayer(
                                userMarker
                            );
                        }

                        if (accuracyCircle) {
                            map.removeLayer(
                                accuracyCircle
                            );
                        }

                        userMarker =
                            L.marker(
                                [lat, lon],
                                {
                                    icon: userIcon()
                                }
                            )
                            .addTo(map)
                            .bindPopup("📍 Ви тут")
                            .openPopup();

                        accuracyCircle =
                            L.circle(
                                [lat, lon],
                                {
                                    radius: accuracy,
                                    color: "#10b981",
                                    fillColor: "#10b981",
                                    fillOpacity: 0.08,
                                    weight: 1
                                }
                            )
                            .addTo(map);

                        showStatus(
                            "Локацію визначено. " +
                            "Точність приблизно " +
                            Math.round(accuracy) +
                            " м."
                        );

                        setTimeout(
                            hideStatus,
                            5000
                        );
                    },

                    error => {

                        if (error.code === 1) {
                            showStatus(
                                "Доступ до геолокації заборонено."
                            );
                        } else if (error.code === 2) {
                            showStatus(
                                "Не вдалося визначити координати."
                            );
                        } else if (error.code === 3) {
                            showStatus(
                                "Час очікування геолокації вичерпано."
                            );
                        }
                    },

                    {
                        enableHighAccuracy: true,
                        timeout: 30000,
                        maximumAge: 0
                    }
                );
            });

        /*
         * OVERPASS
         */

        async function overpassRequest(query) {

            const url =
                "https://overpass-api.de/api/interpreter?data=" +
                encodeURIComponent(query);

            const response =
                await fetch(url);

            if (!response.ok) {
                throw new Error(
                    "Overpass HTTP " +
                    response.status
                );
            }

            return await response.json();
        }

        /*
         * ПЕРЕТВОРЕННЯ OSM
         */

        function parseOSM(elements, defaultName) {

            const places = [];

            elements.forEach(element => {

                const lat =
                    element.lat ??
                    element.center?.lat;

                const lon =
                    element.lon ??
                    element.center?.lon;

                const tags =
                    element.tags || {};

                const name =
                    tags.name ||
                    tags.brand ||
                    tags.operator ||
                    defaultName;

                const street =
                    tags["addr:street"] || "";

                const house =
                    tags["addr:housenumber"] || "";

                const address =
                    [street, house]
                        .filter(Boolean)
                        .join(", ");

                if (
                    typeof lat !== "number" ||
                    typeof lon !== "number"
                ) {
                    return;
                }

                places.push({
                    id: element.id,
                    lat,
                    lon,
                    name,
                    address,
                    source: "OpenStreetMap"
                });
            });

            const unique = new Map();

            places.forEach(place => {

                const key =
                    normalizeName(place.name) +
                    "|" +
                    place.lat.toFixed(5) +
                    "|" +
                    place.lon.toFixed(5);

                unique.set(
                    key,
                    place
                );
            });

            return Array.from(
                unique.values()
            );
        }

        /*
         * ПЕРЕВІРЕНІ LION
         *
         * Адреси взяті з актуальних
         * публічних повідомлень LION.
         */

        const VERIFIED_LION = [

            {
                name: "LION KURS — ТРЦ Екватор",
                address:
                    "м. Рівне, вул. Кулика і Гудачека, 23",
                lat: 50.625864,
                lon: 26.200237,
                source: "LION Telegram"
            },

            {
                name: "LION KURS — ЦУМ",
                address:
                    "м. Рівне, вул. Соборна, 17",
                lat: 50.618590,
                lon: 26.252720,
                source: "LION Telegram"
            },

            {
                name: "LION KURS — ТРЦ Чайка",
                address:
                    "м. Рівне, вул. Василя Червонія, 16",
                lat: 50.629400,
                lon: 26.272404,
                source: "LION Telegram"
            },

            {
                name: "LION KURS — Щасливе",
                address:
                    "м. Рівне, вул. Чорновола, 98а",
                lat: 50.595306,
                lon: 26.257934,
                source: "LION Telegram"
            },

            {
                name: "LION KURS — Покровський",
                address:
                    "м. Рівне, вул. Княгині Ольги, 1",
                lat: 50.616909,
                lon: 26.265080,
                source: "LION Telegram"
            }
        ];

        /*
         * БАНКИ
         */

        async function loadBanks() {

            showStatus(
                "Завантажую реальні банки Рівного..."
            );

            const query = `
                [out:json][timeout:25];
                (
                    node["amenity"="bank"](50.57,26.15,50.68,26.38);
                    way["amenity"="bank"](50.57,26.15,50.68,26.38);
                    relation["amenity"="bank"](50.57,26.15,50.68,26.38);
                );
                out center tags;
            `;

            try {

                const data =
                    await overpassRequest(query);

                bankData =
                    parseOSM(
                        data.elements,
                        "Банк без назви"
                    );

                renderList(
                    bankList,
                    bankData,
                    false
                );

                showAllBanks();

                showStatus(
                    "Знайдено банків: " +
                    bankData.length
                );

                setTimeout(
                    hideStatus,
                    4000
                );

            } catch (error) {

                console.error(
                    "Banks error:",
                    error
                );

                showStatus(
                    "Не вдалося завантажити банки."
                );
            }
        }

        /*
         * ОБМІННИКИ:
         *
         * OSM + LION
         */

        async function loadExchanges() {

            showStatus(
                "Завантажую обмінники Рівного..."
            );

            const query = `
                [out:json][timeout:25];
                (
                    node["amenity"="bureau_de_change"](50.57,26.15,50.68,26.38);
                    way["amenity"="bureau_de_change"](50.57,26.15,50.68,26.38);
                    relation["amenity"="bureau_de_change"](50.57,26.15,50.68,26.38);
                );
                out center tags;
            `;

            try {

                const data =
                    await overpassRequest(query);

                const osmExchanges =
                    parseOSM(
                        data.elements,
                        "Обмінник без назви"
                    );

                /*
                 * Об'єднуємо OSM + LION.
                 */
                exchangeData =
                    [
                        ...VERIFIED_LION,
                        ...osmExchanges
                    ];

                renderList(
                    exchangeList,
                    exchangeData,
                    true
                );

                showAllExchanges();

                showStatus(
                    "Знайдено обмінників: " +
                    exchangeData.length +
                    " — включно з перевіреними точками LION."
                );

                setTimeout(
                    hideStatus,
                    5000
                );

            } catch (error) {

                console.error(
                    "Exchange error:",
                    error
                );

                /*
                 * Навіть якщо OSM тимчасово
                 * недоступний, LION все одно
                 * показується.
                 */

                exchangeData =
                    [...VERIFIED_LION];

                renderList(
                    exchangeList,
                    exchangeData,
                    true
                );

                showAllExchanges();

                showStatus(
                    "OSM тимчасово недоступний. " +
                    "Показано перевірені точки LION."
                );
            }
        }

        /*
         * ПОКАЗ БАНКІВ
         */

        function showAllBanks() {

            clearBankMarkers();

            bankData.forEach(bank => {

                const marker =
                    L.marker(
                        [bank.lat, bank.lon],
                        {
                            icon: bankIcon()
                        }
                    )
                    .addTo(map);

                marker.bindPopup(
                    popupHtml(bank)
                );

                bankMarkers.push(marker);
            });
        }

        /*
         * ПОКАЗ ОБМІННИКІВ
         */

        function showAllExchanges() {

            clearExchangeMarkers();

            exchangeData.forEach(exchange => {

                const verified =
                    exchange.source ===
                    "LION Telegram";

                const marker =
                    L.marker(
                        [exchange.lat, exchange.lon],
                        {
                            icon:
                                exchangeIcon(
                                    verified
                                )
                        }
                    )
                    .addTo(map);

                marker.bindPopup(
                    popupHtml(exchange)
                );

                exchangeMarkers.push(marker);
            });
        }

        /*
         * ПОКАЗ ОБРАНОЇ МЕРЕЖІ
         */

        function showNetwork(
            place,
            type
        ) {

            let data =
                type === "bank"
                    ? bankData
                    : exchangeData;

            let normalized =
                normalizeName(
                    place.name
                );

            /*
             * Для LION усі точки
             * починаються з LION KURS.
             */
            let same = [];

            if (
                place.source === "LION Telegram"
            ) {

                same =
                    exchangeData.filter(
                        item =>
                            item.source ===
                            "LION Telegram"
                    );

            } else {

                same =
                    data.filter(
                        item =>
                            normalizeName(
                                item.name
                            ) === normalized
                    );
            }

            if (!same.length) {
                return;
            }

            if (type === "bank") {
                clearBankMarkers();
            } else {
                clearExchangeMarkers();
            }

            const markers = [];

            same.forEach(item => {

                const verified =
                    item.source ===
                    "LION Telegram";

                const marker =
                    L.marker(
                        [item.lat, item.lon],
                        {
                            icon:
                                type === "bank"
                                    ? bankIcon()
                                    : exchangeIcon(
                                        verified
                                    )
                        }
                    )
                    .addTo(map);

                marker.bindPopup(
                    popupHtml(item)
                );

                markers.push(marker);
            });

            if (
                type === "bank"
            ) {
                bankMarkers = markers;
            } else {
                exchangeMarkers = markers;
            }

            const bounds =
                L.latLngBounds(
                    same.map(
                        item =>
                            [
                                item.lat,
                                item.lon
                            ]
                    )
                );

            if (same.length === 1) {

                map.setView(
                    [
                        same[0].lat,
                        same[0].lon
                    ],
                    16
                );

            } else {

                map.fitBounds(
                    bounds,
                    {
                        padding: [70,70],
                        maxZoom: 16
                    }
                );
            }
        }

        /*
         * СПИСОК
         */

        function renderList(
            container,
            data,
            isExchange
        ) {

            container.innerHTML = "";

            const groups = new Map();

            data.forEach(place => {

                const groupKey =
                    place.source ===
                    "LION Telegram"
                        ? "lion_kurs"
                        : normalizeName(
                            place.name
                        );

                if (!groups.has(groupKey)) {

                    groups.set(
                        groupKey,
                        {
                            name:
                                place.source ===
                                "LION Telegram"
                                    ? "LION KURS"
                                    : place.name,
                            items: []
                        }
                    );
                }

                groups
                    .get(groupKey)
                    .items
                    .push(place);
            });

            const sorted =
                Array.from(
                    groups.values()
                ).sort(
                    (a,b) =>
                        a.name.localeCompare(
                            b.name,
                            "uk"
                        )
                );

            if (!sorted.length) {

                container.innerHTML =
                    '<div style="padding:15px;color:#aaa;">Нічого не знайдено.</div>';

                return;
            }

            sorted.forEach(group => {

                const button =
                    document.createElement(
                        "button"
                    );

                button.className =
                    "item";

                button.type =
                    "button";

                const first =
                    group.items[0];

                const isLion =
                    first.source ===
                    "LION Telegram";

                const address =
                    isLion
                        ? `${group.items.length} перевірених точок`
                        : (
                            first.address ||
                            `${group.items.length} точок`
                          );

                button.innerHTML = `
                    <span class="item-name">
                        ${escapeHtml(group.name)}
                    </span>

                    <span class="item-address">
                        ${escapeHtml(address)}
                    </span>

                    ${
                        isLion
                            ? `<span class="item-source">
                                перевірено
                               </span>`
                            : ""
                    }
                `;

                button.onclick =
                    () => {

                        showNetwork(
                            first,
                            isExchange
                                ? "exchange"
                                : "bank"
                        );

                        if (isExchange) {
                            exchangePanel
                                .classList
                                .remove("open");
                        } else {
                            bankPanel
                                .classList
                                .remove("open");
                        }
                    };

                container.appendChild(
                    button
                );
            });
        }

        /*
         * ПОШУК БАНКІВ
         */

        bankSearch.addEventListener(
            "input",
            () => {

                const value =
                    bankSearch.value
                        .trim()
                        .toLowerCase();

                const filtered =
                    bankData.filter(
                        item =>
                            item.name
                                .toLowerCase()
                                .includes(value)
                    );

                renderList(
                    bankList,
                    filtered,
                    false
                );
            }
        );

        /*
         * ПОШУК ОБМІННИКІВ
         */

        exchangeSearch.addEventListener(
            "input",
            () => {

                const value =
                    exchangeSearch.value
                        .trim()
                        .toLowerCase();

                const filtered =
                    exchangeData.filter(
                        item =>
                            item.name
                                .toLowerCase()
                                .includes(value) ||
                            item.address
                                .toLowerCase()
                                .includes(value)
                    );

                renderList(
                    exchangeList,
                    filtered,
                    true
                );
            }
        );

        /*
         * БАНКИ
         */

        document
            .getElementById("banksButton")
            .addEventListener(
                "click",
                async () => {

                    exchangePanel
                        .classList
                        .remove("open");

                    bankPanel
                        .classList
                        .toggle("open");

                    if (
                        bankPanel
                            .classList
                            .contains("open") &&
                        bankData.length === 0
                    ) {
                        await loadBanks();
                    }
                }
            );

        /*
         * ОБМІННИКИ
         */

        document
            .getElementById("exchangeButton")
            .addEventListener(
                "click",
                async () => {

                    bankPanel
                        .classList
                        .remove("open");

                    exchangePanel
                        .classList
                        .toggle("open");

                    if (
                        exchangePanel
                            .classList
                            .contains("open") &&
                        exchangeData.length === 0
                    ) {
                        await loadExchanges();
                    }
                }
            );

        function clearBankMarkers() {

            bankMarkers.forEach(
                marker =>
                    map.removeLayer(
                        marker
                    )
            );

            bankMarkers = [];
        }

        function clearExchangeMarkers() {

            exchangeMarkers.forEach(
                marker =>
                    map.removeLayer(
                        marker
                    )
            );

            exchangeMarkers = [];
        }

        showStatus(
            "Карта Рівного готова."
        );

        setTimeout(
            hideStatus,
            3000
        );

    </script>

</body>

</html>
